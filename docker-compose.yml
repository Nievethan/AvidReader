version: '3.8'

services:
  # Core API -- CPU-only, no external services required to start.
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_data:/app/data
    environment:
      - APP_ENV=local
      - DATABASE_URL=sqlite:///./data/avidreader.db
      - UPLOADS_DIR=./data/uploads
      # Blank by default: optional integrations below are opt-in via the
      # "full" profile. /ready reports them as "not configured" when unset.
      - QDRANT_URL=
      - NEO4J_URI=
      - NEO4J_USER=
      - NEO4J_PASSWORD=

  # Vector database for semantic search (Umer). Optional: only starts
  # with `docker compose --profile full up`.
  qdrant:
    image: qdrant/qdrant:latest
    profiles: ["full"]
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # Graph database for character/relationship data (Gitae). Optional:
  # only starts with `docker compose --profile full up`.
  neo4j:
    image: neo4j:5.12.0
    profiles: ["full"]
    ports:
      - "7474:7474" # HTTP interface
      - "7687:7687" # Bolt protocol
    environment:
      # Never hardcode a real password. Set NEO4J_PASSWORD in a local
      # .env file (see backend/.env.example); this placeholder is for
      # local development only.
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-change_me_locally}
    volumes:
      - neo4j_data:/data

volumes:
  backend_data:
  qdrant_data:
  neo4j_data:
