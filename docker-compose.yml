
services:
  # Core API -- CPU-only. Cloudflare credentials are read from backend/.env
  # (mounted with the code); without them it uses offline fallbacks.
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
      - backend_data:/app/data
    environment:
      - APP_ENV=local
      - DATABASE_URL=sqlite:///./data/avidreader.db
      - UPLOADS_DIR=./data/uploads
      # Book vectors live in the qdrant service below.
      - QDRANT_URL=http://qdrant:6333
      # Neo4j stays opt-in via the "full" profile; blank = not configured.
      - NEO4J_URI=
      - NEO4J_USER=
      - NEO4J_PASSWORD=
    depends_on:
      - qdrant

  # Vector database for semantic search (Umer). Always starts: uploads are
  # indexed into it and chat retrieves from it.
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # Graph database for character/relationship data (Gitae). Optional:
  # only starts with `docker compose --profile full up`.
  neo4j:
    image: neo4j:5.12.0
    profiles: ["full"]
    ports:
      - "127.0.0.1:7474:7474" # HTTP interface
      - "127.0.0.1:7687:7687" # Bolt protocol
    environment:
      # Never hardcode a real password. Set NEO4J_PASSWORD in a local
      # .env file (see backend/.env.example); this placeholder is for
      # local development only.
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-change_me_locally}
    volumes:
      - neo4j_data:/data

volumes:
  backend_data:
  qdrant_data:
  neo4j_data:
